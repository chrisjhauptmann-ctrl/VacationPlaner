name: Plan Route

on:
  push:
    paths:
      - 'input/request.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r planner/requirements.txt

      - name: Run route planner
        run: python planner/route_planner.py

      - name: Commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ docs/
          git diff --staged --quiet || git commit -m "🗺️ Route update $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
