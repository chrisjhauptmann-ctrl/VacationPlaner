<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🗺️ VacationPlaner</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f1117;--card:#1a1d27;--border:#2a2d3a;--accent:#4ade80;--accent2:#60a5fa;--text:#e2e8f0;--muted:#64748b}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:1rem}
h1{font-family:'DM Mono',monospace;font-size:1.3rem;color:var(--accent);margin-bottom:0.2rem}
.sub{color:var(--muted);font-size:0.78rem;margin-bottom:1.2rem;font-family:'DM Mono',monospace}
.grid{display:grid;grid-template-columns:320px 1fr;gap:1rem;max-width:1100px;margin:0 auto}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.1rem}
label{display:block;font-size:0.7rem;color:var(--muted);font-family:'DM Mono',monospace;margin:0.8rem 0 0.25rem;text-transform:uppercase;letter-spacing:0.05em}
label:first-child{margin-top:0}
input,select{width:100%;background:#0f1117;border:1px solid var(--border);border-radius:8px;padding:0.45rem 0.65rem;color:var(--text);font-size:0.88rem;font-family:'DM Sans',sans-serif;outline:none;transition:border 0.2s}
input:focus,select:focus{border-color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0.5rem}
.btn{width:100%;margin-top:1rem;padding:0.65rem;background:var(--accent);color:#0f1117;border:none;border-radius:8px;font-weight:600;font-size:0.9rem;cursor:pointer;transition:opacity 0.2s}
.btn:hover{opacity:0.85}
.btn:disabled{opacity:0.4;cursor:not-allowed}
#map{height:380px;border-radius:12px;overflow:hidden;margin-bottom:0.8rem}
@media(max-width:700px){#map{height:240px}}
.route-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:0.85rem 1rem;cursor:pointer;transition:border 0.2s;margin-bottom:0.5rem}
.route-card:hover,.route-card.active{border-color:var(--accent)}
.route-name{font-size:0.83rem;font-weight:600;margin-bottom:0.35rem}
.route-stats{display:flex;gap:0.8rem;font-size:0.78rem;color:var(--muted);flex-wrap:wrap}
.badge{font-size:0.68rem;padding:2px 6px;border-radius:4px;font-family:'DM Mono',monospace;margin-left:0.4rem}
.badge.ok{background:#14532d;color:#4ade80}
.badge.warn{background:#451a03;color:#fb923c}
.gpx-btn{margin-top:0.5rem;font-size:0.76rem;padding:0.28rem 0.65rem;background:var(--accent2);color:#0f1117;border-radius:6px;font-weight:600;cursor:pointer;border:none;font-family:'DM Sans',sans-serif}
.focus-btn{margin-top:0.5rem;margin-left:0.4rem;font-size:0.76rem;padding:0.28rem 0.65rem;background:var(--accent);color:#0f1117;border-radius:6px;font-weight:600;cursor:pointer;border:none;font-family:'DM Sans',sans-serif}
.status{font-size:0.78rem;color:var(--muted);font-family:'DM Mono',monospace;margin-top:0.6rem;min-height:1.1rem}
.poi-row{display:flex;gap:0.4rem;margin-bottom:0.3rem}
.poi-row input{flex:1}
.poi-row button{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:0.3rem 0.55rem;cursor:pointer;font-size:0.8rem}
.add-btn{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:0.28rem 0.65rem;cursor:pointer;font-size:0.76rem;margin-top:0.3rem}
.camp-item{display:flex;align-items:center;gap:0.4rem;margin-bottom:0.3rem}
.camp-item input{flex:1;font-size:0.82rem}
.camp-btn{font-size:0.72rem;padding:0.28rem 0.55rem;border-radius:6px;font-weight:600;cursor:pointer;border:none;font-family:'DM Sans',sans-serif;white-space:nowrap}
.camp-item .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.trip-item{padding:0.5rem 0.7rem;border-radius:8px;cursor:pointer;border:1px solid transparent;margin-bottom:0.3rem;transition:all 0.15s}
.trip-item:hover{border-color:var(--border);background:#0f1117}
.trip-item.active{border-color:var(--accent);background:#0f1117}
.trip-item-name{font-size:0.83rem;font-weight:600}
.trip-item-meta{font-size:0.7rem;color:var(--muted);font-family:'DM Mono',monospace;margin-top:0.1rem}
.spinner{display:inline-block;width:12px;height:12px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:middle;margin-right:5px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div style="max-width:1100px;margin:0 auto">
  <h1>🗺️ VacationPlaner <span style="font-size:0.6rem;color:var(--muted);font-weight:400">v0.9</span></h1>
  <div class="sub">bikepacking route planner · brouter api · no backend</div>
</div>

<div class="grid">
  <div>
    <div class="panel">
      <label>📁 Trips</label>
      <div id="tripList" style="margin-bottom:0.8rem"><div style="font-size:0.75rem;color:var(--muted)"><span class="spinner"></span>Lade...</div></div>

      <label>Startpunkt</label>
      <input id="startInput" placeholder="z.B. Pamplona" value="Pamplona"/>

      <label>Ziel km / hm</label>
      <div class="row2">
        <input id="targetKm" type="number" value="80" min="10" max="300"/>
        <input id="targetHm" type="number" value="1400" min="0" max="5000"/>
      </div>

      <label>Profil</label>
      <select id="profile">
        <option value="gravel">Gravel / E-MTB</option>
        <option value="trekking">Touring / Trekking</option>
        <option value="fastbike">Rennrad</option>
        <option value="safety">Safety (ruhige Straßen)</option>
      </select>

      <label>Wegpunkte / POIs</label>
      <div id="poisContainer">
        <div class="poi-row">
          <input placeholder="POI Name (optional)" class="poi-name"/>
          <input placeholder="lat,lon" class="poi-coords" style="max-width:110px"/>
          <button onclick="removePoi(this)">×</button>
        </div>
      </div>
      <button class="add-btn" onclick="addPoi()">+ POI hinzufügen</button>

      <label>🏕️ Campingplätze</label>
      <div id="campsiteList" style="margin-bottom:0.5rem"></div>
      <button class="add-btn" onclick="addCampsite()">+ Campingplatz hinzufügen</button>

      <div style="margin-top:0.8rem;display:flex;gap:0.5rem">
        <button class="btn" style="margin-top:0" onclick="calcAllCampsites()">🚴 Alle berechnen</button>
        <button class="btn" style="margin-top:0;background:transparent;border:1px solid var(--border);color:var(--muted)" onclick="clearRoutes()">✕ Löschen</button>
      </div>
      <div class="status" id="status"></div>
    </div>
  </div>

  <div>
    <div id="map"></div>
    <div id="routeResults"></div>
  </div>
</div>

<script>
const map = L.map('map').setView([43.18, -1.78], 9);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap'
}).addTo(map);

const REPO = 'chrisjhauptmann-ctrl/VacationPlaner';
const COLORS = ['#4ade80','#60a5fa','#f97316'];
let routeLayers = [], markerLayer = L.layerGroup().addTo(map), routes = [];

function fillForm(trip) {
  if (trip.start) document.getElementById('startInput').value = trip.start;
  if (trip.target_km) document.getElementById('targetKm').value = trip.target_km;
  if (trip.target_hm) document.getElementById('targetHm').value = trip.target_hm;
  if (trip.profile) document.getElementById('profile').value = trip.profile;
  if (trip.num_routes) document.getElementById('numRoutes').value = Math.min(trip.num_routes, 3);
  if (trip.end) document.getElementById('endInput').value = trip.end;
  if (trip.pois && trip.pois.length) {
    document.getElementById('poisContainer').innerHTML = '';
    trip.pois.forEach(p => {
      const row = document.createElement('div');
      row.className = 'poi-row';
      row.innerHTML = `<input placeholder="POI Name" class="poi-name" value="${p.name||''}"/><input placeholder="lat,lon" class="poi-coords" style="max-width:110px" value="${p.coords||''}"/><button onclick="removePoi(this)">×</button>`;
      document.getElementById('poisContainer').appendChild(row);
    });
  }
  if (trip.campsites && trip.campsites.length) {
    document.getElementById('campsiteList').innerHTML = '';
    trip.campsites.forEach(c => addCampsite(c.name, c.coords));
  }
  clearRoutes();
  showCampsiteMarkers();
  setStatus(`✅ "${trip.name||'Trip'}" geladen`);
}

async function loadRepoTrips() {
  const el = document.getElementById('tripList');
  try {
    const r = await fetch(`https://api.github.com/repos/${REPO}/contents/trips`);
    if (!r.ok) throw new Error();
    const files = await r.json();
    const jsons = files.filter(f => f.name.endsWith('.json'));
    if (!jsons.length) { el.innerHTML = '<div style="font-size:0.75rem;color:var(--muted)">Noch keine Trips.</div>'; return; }
    el.innerHTML = '';
    for (const f of jsons) {
      const trip = await (await fetch(f.download_url)).json();
      const div = document.createElement('div');
      div.className = 'trip-item';
      div.innerHTML = `<div class="trip-item-name">${trip.name}</div><div class="trip-item-meta">${trip.target_km}km · ${trip.target_hm}hm · ${trip.profile}</div>`;
      div.onclick = () => {
        document.querySelectorAll('.trip-item').forEach(x => x.classList.remove('active'));
        div.classList.add('active');
        fillForm(trip);
      };
      el.appendChild(div);
    }
  } catch(e) {
    el.innerHTML = '<div style="font-size:0.75rem;color:var(--muted)">Keine Trips gefunden.</div>';
  }
}

function setStatus(msg) {
  const el = document.getElementById('status');
  el.innerHTML = msg;
}

async function geocode(query) {
  if (!query) return null;
  const m = query.match(/^(-?\d+\.?\d*),\s*(-?\d+\.?\d*)$/);
  if (m) return { lat: parseFloat(m[1]), lon: parseFloat(m[2]), name: query };
  const r = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=1`, {headers:{'Accept-Language':'de'}});
  const d = await r.json();
  if (!d.length) return null;
  return { lat: parseFloat(d[0].lat), lon: parseFloat(d[0].lon), name: d[0].display_name };
}

async function fetchRoute(waypoints, profile, altIdx=0) {
  const lonlats = waypoints.map(w=>`${w.lon},${w.lat}`).join('|');
  const r = await fetch(`https://brouter.de/brouter?lonlats=${lonlats}&profile=${profile}&alternativeidx=${altIdx}&format=geojson`);
  if (!r.ok) throw new Error(`BRouter ${r.status}`);
  return r.json();
}

async function fetchGPX(waypoints, profile, altIdx=0) {
  const lonlats = waypoints.map(w=>`${w.lon},${w.lat}`).join('|');
  const r = await fetch(`https://brouter.de/brouter?lonlats=${lonlats}&profile=${profile}&alternativeidx=${altIdx}&format=gpx`);
  return r.text();
}

function parseStats(geojson) {
  const p = geojson.features[0].properties;
  return {
    km: Math.round(parseInt(p['track-length'])/100)/10,
    hm: parseInt(p['filtered ascend']||0),
    h: Math.round(parseInt(p['total-time'])/360)/10
  };
}

function evaluate(stats, targetKm, targetHm) {
  const tolKm = Math.max(10, targetKm*0.12), tolHm = Math.max(200, targetHm*0.15);
  return {
    kmOk: Math.abs(stats.km-targetKm)<=tolKm,
    hmOk: Math.abs(stats.hm-targetHm)<=tolHm,
    kmDiff: Math.round((stats.km-targetKm)*10)/10,
    hmDiff: stats.hm-targetHm
  };
}

// ── POIs ──────────────────────────────────────────────────
function addPoi() {
  const row = document.createElement('div');
  row.className = 'poi-row';
  row.innerHTML = `<input placeholder="POI Name" class="poi-name"/><input placeholder="lat,lon" class="poi-coords" style="max-width:110px"/><button onclick="removePoi(this)">×</button>`;
  document.getElementById('poisContainer').appendChild(row);
}
function removePoi(btn) { btn.parentElement.remove(); }

// ── Campsites ─────────────────────────────────────────────
const CAMP_COLORS = ['#4ade80','#60a5fa','#f97316','#a78bfa','#f472b6'];

function addCampsite(name='', coords='') {
  const idx = document.getElementById('campsiteList').children.length;
  if (idx >= 5) return;
  const row = document.createElement('div');
  row.className = 'camp-item';
  row.innerHTML = `
    <div class="dot" style="background:${CAMP_COLORS[idx]}"></div>
    <input placeholder="Name" class="camp-name" value="${name}" style="flex:1.2"/>
    <input placeholder="lat,lon" class="camp-coords" value="${coords}" style="max-width:105px"/>
    <button class="camp-btn" style="background:var(--accent2);color:#0f1117" onclick="calcCampsite(this)">▶</button>
    <button class="camp-btn" style="background:transparent;border:1px solid var(--border);color:var(--muted)" onclick="this.closest('.camp-item').remove()">×</button>`;
  document.getElementById('campsiteList').appendChild(row);
}

function getCampsiteIndex(btn) {
  return Array.from(document.getElementById('campsiteList').children).indexOf(btn.closest('.camp-item'));
}

// show campsite markers on map without calculating routes
async function showCampsiteMarkers() {
  markerLayer.clearLayers();
  const start = await geocode(document.getElementById('startInput').value);
  if (!start) return;
  L.marker([start.lat, start.lon]).addTo(markerLayer).bindPopup(`🚴 ${start.name.split(',')[0]}`).openPopup();

  const rows = document.querySelectorAll('.camp-item');
  rows.forEach((row, i) => {
    const coords = row.querySelector('.camp-coords').value.trim();
    const name = row.querySelector('.camp-name').value.trim() || `Camping ${i+1}`;
    if (!coords) return;
    const m = coords.match(/^(-?\d+\.?\d*),\s*(-?\d+\.?\d*)$/);
    if (!m) return;
    L.circleMarker([parseFloat(m[1]), parseFloat(m[2])], {radius:10, color:CAMP_COLORS[i], fillColor:CAMP_COLORS[i], fillOpacity:0.9})
      .addTo(markerLayer).bindPopup(`🏕️ ${name}`);
  });
}

// calculate route to one specific campsite
async function calcCampsite(btn) {
  const idx = getCampsiteIndex(btn);
  const row = btn.closest('.camp-item');
  const coords = row.querySelector('.camp-coords').value.trim();
  const name = row.querySelector('.camp-name').value.trim() || `Camping ${idx+1}`;
  if (!coords) { setStatus('❌ Keine Koordinaten'); return; }

  btn.textContent = '⏳'; btn.disabled = true;
  setStatus(`<span class="spinner"></span>Berechne Route zu ${name}...`);

  try {
    const start = await geocode(document.getElementById('startInput').value);
    if (!start) throw new Error('Start nicht gefunden');
    const targetKm = parseFloat(document.getElementById('targetKm').value);
    const targetHm = parseFloat(document.getElementById('targetHm').value);
    const profile = document.getElementById('profile').value;

    const poiRows = document.querySelectorAll('.poi-row');
    const pois = [];
    for (const r of poiRows) {
      const c = r.querySelector('.poi-coords').value.trim();
      const n = r.querySelector('.poi-name').value.trim() || 'POI';
      if (c) { const g = await geocode(c); if (g) pois.push({...g, name:n}); }
    }

    const m = coords.match(/^(-?\d+\.?\d*),\s*(-?\d+\.?\d*)$/);
    if (!m) throw new Error('Ungültige Koordinaten');
    const end = {lat: parseFloat(m[1]), lon: parseFloat(m[2]), name};
    const waypoints = [start, ...pois, end];

    const geojson = await fetchRoute(waypoints, profile, 0);
    const gpxData = await fetchGPX(waypoints, profile, 0);
    const stats = parseStats(geojson);
    const ev = evaluate(stats, targetKm, targetHm);

    // remove existing route for this idx if present
    if (routeLayers[idx]) { map.removeLayer(routeLayers[idx]); }
    if (routes[idx]?.card) routes[idx].card.remove();

    const layer = L.geoJSON(geojson, {style:{color:CAMP_COLORS[idx], weight:4, opacity:1}}).addTo(map);
    routeLayers[idx] = layer;
    routes[idx] = {stats, ev, gpxData, card: null};
    map.fitBounds(layer.getBounds(), {padding:[20,20]});

    renderCampsiteCard(name, stats, ev, idx, gpxData);
    setStatus(`✅ ${name}: ${stats.km}km / ${stats.hm}hm`);
  } catch(e) {
    setStatus(`❌ ${e.message}`);
  }
  btn.textContent = '▶'; btn.disabled = false;
}

async function calcAllCampsites() {
  const rows = document.querySelectorAll('.camp-item');
  for (const row of rows) {
    await calcCampsite(row.querySelector('.camp-btn'));
  }
}

function clearRoutes() {
  routeLayers.forEach(l => l && map.removeLayer(l));
  routeLayers = []; routes = [];
  document.getElementById('routeResults').innerHTML = '';
  setStatus('');
}

function renderCampsiteCard(name, stats, ev, idx, gpxData) {
  const old = document.getElementById(`card-${idx}`);
  if (old) old.remove();
  const meets = ev.kmOk && ev.hmOk;
  const badge = meets ? '<span class="badge ok">✅ Ziel</span>' : '<span class="badge warn">⚠️ außerhalb</span>';
  const kmCol = ev.kmOk ? '#4ade80' : '#f87171';
  const hmCol = ev.hmOk ? '#4ade80' : '#f87171';
  const card = document.createElement('div');
  card.className = 'route-card'; card.id = `card-${idx}`;
  card.innerHTML = `
    <div class="route-name" style="color:${CAMP_COLORS[idx]}">🏕️ ${name} ${badge}</div>
    <div class="route-stats">
      <span style="color:${kmCol}">🚴 ${stats.km}km (${ev.kmDiff>0?'+':''}${ev.kmDiff})</span>
      <span style="color:${hmCol}">⛰️ ${stats.hm}hm (${ev.hmDiff>0?'+':''}${ev.hmDiff})</span>
      <span>⏱️ ${stats.h}h</span>
    </div>
    <button class="gpx-btn" onclick="dlGPX(${idx})">⬇ GPX</button>
    <button class="focus-btn" onclick="focusRoute(${idx})">🗺 Fokus</button>`;
  card.addEventListener('click', ()=>focusRoute(idx));
  if (routes[idx]) routes[idx].card = card;
  document.getElementById('routeResults').appendChild(card);
}

function dlGPX(i) {
  if (!routes[i]?.gpxData) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([routes[i].gpxData],{type:'application/gpx+xml'}));
  a.download = `route_camping_${i+1}.gpx`; a.click();
}

function focusRoute(i) {
  if (!routeLayers[i]) return;
  map.fitBounds(routeLayers[i].getBounds(), {padding:[20,20]});
  routeLayers.forEach((l,j)=>l&&l.setStyle({opacity:j===i?1:0.25,weight:j===i?5:2}));
  document.querySelectorAll('.route-card').forEach(c=>c.classList.remove('active'));
  const card = document.getElementById(`card-${i}`);
  if (card) card.classList.add('active');
}

loadRepoTrips();
</script>
</body>
</html>
