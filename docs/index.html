<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🗺️ VacationPlaner</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f1117;--card:#1a1d27;--border:#2a2d3a;--accent:#4ade80;--accent2:#60a5fa;--text:#e2e8f0;--muted:#64748b}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:1rem}
h1{font-family:'DM Mono',monospace;font-size:1.3rem;color:var(--accent);margin-bottom:0.2rem}
.sub{color:var(--muted);font-size:0.78rem;margin-bottom:1.2rem;font-family:'DM Mono',monospace}
.grid{display:grid;grid-template-columns:300px 1fr;gap:1rem;max-width:1200px;margin:0 auto}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.1rem;margin-bottom:1rem}
h2{font-size:0.7rem;color:var(--muted);font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:0.8rem}
#map{height:420px;border-radius:12px;overflow:hidden;margin-bottom:0.8rem}
@media(max-width:700px){#map{height:260px}}

/* Trip list */
.trip-item{padding:0.65rem 0.8rem;border-radius:8px;cursor:pointer;border:1px solid transparent;margin-bottom:0.4rem;transition:all 0.15s}
.trip-item:hover{border-color:var(--border);background:#0f1117}
.trip-item.active{border-color:var(--accent);background:#0f1117}
.trip-name{font-size:0.85rem;font-weight:600;color:var(--text)}
.trip-meta{font-size:0.72rem;color:var(--muted);font-family:'DM Mono',monospace;margin-top:0.2rem}
.trip-target{font-size:0.7rem;color:var(--muted);margin-top:0.15rem}
.empty{font-size:0.78rem;color:var(--muted);font-family:'DM Mono',monospace;padding:0.5rem 0}

/* Route cards */
.route-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:0.85rem 1rem;cursor:pointer;transition:border 0.2s;margin-bottom:0.5rem}
.route-card:hover,.route-card.active{border-color:var(--accent)}
.route-name{font-size:0.85rem;font-weight:600;margin-bottom:0.25rem}
.route-camp{font-size:0.75rem;color:var(--muted);margin-bottom:0.35rem}
.route-stats{display:flex;gap:0.8rem;font-size:0.78rem;color:var(--muted);flex-wrap:wrap}
.badge{font-size:0.65rem;padding:2px 6px;border-radius:4px;font-family:'DM Mono',monospace;margin-left:0.3rem}
.badge.ok{background:#14532d;color:#4ade80}
.badge.warn{background:#451a03;color:#fb923c}
.gpx-btn{margin-top:0.6rem;font-size:0.76rem;padding:0.28rem 0.65rem;background:var(--accent2);color:#0f1117;border-radius:6px;font-weight:600;cursor:pointer;border:none}
.focus-btn{margin-top:0.6rem;margin-left:0.4rem;font-size:0.76rem;padding:0.28rem 0.65rem;background:var(--accent);color:#0f1117;border-radius:6px;font-weight:600;cursor:pointer;border:none}

.status{font-size:0.75rem;color:var(--muted);font-family:'DM Mono',monospace;margin-top:0.5rem;min-height:1rem}
.spinner{display:inline-block;width:11px;height:11px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:middle;margin-right:4px}
@keyframes spin{to{transform:rotate(360deg)}}

.trip-header{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:0.8rem 1rem;margin-bottom:0.8rem}
.trip-header-name{font-size:1rem;font-weight:600;color:var(--accent)}
.trip-header-meta{font-size:0.75rem;color:var(--muted);font-family:'DM Mono',monospace;margin-top:0.2rem}
</style>
</head>
<body>
<div style="max-width:1200px;margin:0 auto">
  <h1>🗺️ VacationPlaner</h1>
  <div class="sub">bikepacking route planner · brouter api · no backend</div>
</div>

<div class="grid">
  <!-- LEFT: Trip Library -->
  <div>
    <div class="panel">
      <h2>📁 Trips</h2>
      <div id="tripList"><div class="empty"><span class="spinner"></span>Lade Trips...</div></div>
    </div>
  </div>

  <!-- RIGHT: Map + Routes -->
  <div>
    <div id="tripHeader" style="display:none"></div>
    <div id="map"></div>
    <div id="routeStatus" class="status"></div>
    <div id="routeResults"></div>
  </div>
</div>

<script>
const REPO = 'chrisjhauptmann-ctrl/VacationPlaner';
const COLORS = ['#4ade80','#60a5fa','#f97316'];

// ── Map ──────────────────────────────────────────────────────
const map = L.map('map').setView([46, 10], 5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap'
}).addTo(map);
let routeLayers = [];
let markerLayer = L.layerGroup().addTo(map);
let routes = [];

// ── Load trip list from GitHub ───────────────────────────────
async function loadTripList() {
  try {
    const r = await fetch(`https://api.github.com/repos/${REPO}/contents/trips`);
    const files = await r.json();
    const jsonFiles = files.filter(f => f.name.endsWith('.json'));
    if (!jsonFiles.length) {
      document.getElementById('tripList').innerHTML = '<div class="empty">Noch keine Trips. Mit Claude Code einen Trip hinzufügen.</div>';
      return;
    }
    document.getElementById('tripList').innerHTML = '';
    for (const f of jsonFiles) {
      const trip = await fetchTrip(f.download_url);
      renderTripItem(trip, f.download_url);
    }
  } catch(e) {
    document.getElementById('tripList').innerHTML = `<div class="empty">Fehler: ${e.message}</div>`;
  }
}

async function fetchTrip(url) {
  const r = await fetch(url);
  return await r.json();
}

function renderTripItem(trip, url) {
  const el = document.createElement('div');
  el.className = 'trip-item';
  el.innerHTML = `
    <div class="trip-name">${trip.name}</div>
    <div class="trip-meta">${trip.date} · ${trip.profile}</div>
    <div class="trip-target">${trip.target_km} km · ${trip.target_hm} hm</div>
  `;
  el.addEventListener('click', () => {
    document.querySelectorAll('.trip-item').forEach(i => i.classList.remove('active'));
    el.classList.add('active');
    loadTrip(trip);
  });
  document.getElementById('tripList').appendChild(el);
}

// ── Load & calculate a trip ──────────────────────────────────
async function loadTrip(trip) {
  const status = document.getElementById('routeStatus');
  document.getElementById('routeResults').innerHTML = '';
  routeLayers.forEach(l => map.removeLayer(l));
  routeLayers = [];
  markerLayer.clearLayers();
  routes = [];

  // Header
  const header = document.getElementById('tripHeader');
  header.style.display = 'block';
  header.innerHTML = `
    <div class="trip-header">
      <div class="trip-header-name">🗺️ ${trip.name}</div>
      <div class="trip-header-meta">${trip.date} · ${trip.profile} · Ziel: ${trip.target_km} km / ${trip.target_hm} hm</div>
    </div>
  `;

  // Start marker
  L.marker([trip.start.lat, trip.start.lon]).addTo(markerLayer)
    .bindPopup(`🚴 Start: ${trip.start.name}`).openPopup();

  // Calculate each route
  for (let i = 0; i < trip.routes.length; i++) {
    const route = trip.routes[i];
    status.innerHTML = `<span class="spinner"></span>Berechne Route ${i+1}/${trip.routes.length}: ${route.name}...`;

    // POI markers
    route.pois.forEach(p => {
      L.circleMarker([p.lat, p.lon], { radius:6, color:'#fb923c', fillColor:'#fb923c', fillOpacity:0.8 })
        .addTo(markerLayer).bindPopup(`📍 ${p.name}`);
    });

    // Campsite marker
    L.circleMarker([route.campsite.lat, route.campsite.lon], { radius:8, color:COLORS[i], fillColor:COLORS[i], fillOpacity:0.9 })
      .addTo(markerLayer).bindPopup(`🏕️ ${route.campsite.name}`);

    const waypoints = [
      { lat: trip.start.lat, lon: trip.start.lon },
      ...route.pois,
      { lat: route.campsite.lat, lon: route.campsite.lon }
    ];

    try {
      const geojson = await fetchRoute(waypoints, trip.profile);
      const gpxData = await fetchGPX(waypoints, trip.profile);
      const stats = parseStats(geojson);
      const ev = evaluate(stats, trip.target_km, trip.target_hm);

      routes.push({ geojson, stats, ev, gpxData });

      const layer = L.geoJSON(geojson, {
        style: { color: COLORS[i], weight: i === 0 ? 4 : 3, opacity: i === 0 ? 1 : 0.7 }
      }).addTo(map);
      routeLayers.push(layer);

      if (i === 0) map.fitBounds(layer.getBounds(), { padding: [20, 20] });

      renderRouteCard(route, stats, ev, i);
    } catch(e) {
      routeLayers.push(null);
      renderErrorCard(route, i, e.message);
    }
  }

  status.textContent = `✅ ${trip.routes.length} Routen berechnet`;
}

// ── BRouter ──────────────────────────────────────────────────
async function fetchRoute(waypoints, profile) {
  const lonlats = waypoints.map(w => `${w.lon},${w.lat}`).join('|');
  const r = await fetch(`https://brouter.de/brouter?lonlats=${lonlats}&profile=${profile}&alternativeidx=0&format=geojson`);
  if (!r.ok) throw new Error(`BRouter ${r.status}`);
  return r.json();
}

async function fetchGPX(waypoints, profile) {
  const lonlats = waypoints.map(w => `${w.lon},${w.lat}`).join('|');
  const r = await fetch(`https://brouter.de/brouter?lonlats=${lonlats}&profile=${profile}&alternativeidx=0&format=gpx`);
  return r.text();
}

function parseStats(geojson) {
  const p = geojson.features[0].properties;
  return {
    km: Math.round(parseInt(p['track-length']) / 100) / 10,
    hm: parseInt(p['filtered ascend'] || 0),
    h:  Math.round(parseInt(p['total-time']) / 360) / 10,
  };
}

function evaluate(stats, targetKm, targetHm) {
  const tolKm = Math.max(10, targetKm * 0.12);
  const tolHm = Math.max(200, targetHm * 0.15);
  return {
    kmOk: Math.abs(stats.km - targetKm) <= tolKm,
    hmOk: Math.abs(stats.hm - targetHm) <= tolHm,
    kmDiff: Math.round((stats.km - targetKm) * 10) / 10,
    hmDiff: stats.hm - targetHm,
  };
}

// ── Route cards ──────────────────────────────────────────────
function renderRouteCard(route, stats, ev, i) {
  const meets = ev.kmOk && ev.hmOk;
  const badge = meets ? '<span class="badge ok">✅ Ziel</span>' : '<span class="badge warn">⚠️ außerhalb</span>';
  const kmCol = ev.kmOk ? '#4ade80' : '#f87171';
  const hmCol = ev.hmOk ? '#4ade80' : '#f87171';

  const card = document.createElement('div');
  card.className = 'route-card';
  card.innerHTML = `
    <div class="route-name" style="color:${COLORS[i]}">Route ${i+1}: ${route.name} ${badge}</div>
    <div class="route-camp">🏕️ ${route.campsite.name}</div>
    <div class="route-stats">
      <span style="color:${kmCol}">🚴 ${stats.km} km (${ev.kmDiff > 0 ? '+' : ''}${ev.kmDiff})</span>
      <span style="color:${hmCol}">⛰️ ${stats.hm} hm (${ev.hmDiff > 0 ? '+' : ''}${ev.hmDiff})</span>
      <span>⏱️ ${stats.h} h</span>
    </div>
    <button class="gpx-btn" onclick="downloadGPX(${i})">⬇ GPX</button>
    <button class="focus-btn" onclick="focusRoute(${i})">🗺 Fokus</button>
  `;
  card.addEventListener('click', () => focusRoute(i));
  document.getElementById('routeResults').appendChild(card);
}

function renderErrorCard(route, i, msg) {
  const card = document.createElement('div');
  card.className = 'route-card';
  card.innerHTML = `
    <div class="route-name" style="color:#f87171">Route ${i+1}: ${route.name} ❌</div>
    <div class="route-camp">🏕️ ${route.campsite.name}</div>
    <div class="route-stats">${msg}</div>
  `;
  document.getElementById('routeResults').appendChild(card);
}

function focusRoute(i) {
  if (routeLayers[i]) {
    map.fitBounds(routeLayers[i].getBounds(), { padding: [20, 20] });
    routeLayers.forEach((l, j) => l && l.setStyle({ opacity: j===i ? 1 : 0.25, weight: j===i ? 5 : 2 }));
    document.querySelectorAll('.route-card').forEach((c, j) => c.classList.toggle('active', j===i));
  }
}

function downloadGPX(i) {
  if (!routes[i]) return;
  const blob = new Blob([routes[i].gpxData], { type: 'application/gpx+xml' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `route_${i+1}.gpx`;
  a.click();
}

// ── Init ─────────────────────────────────────────────────────
loadTripList();
</script>
</body>
</html>
