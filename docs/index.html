<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🗺️ VacationPlaner</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f1117;--card:#1a1d27;--border:#2a2d3a;--accent:#4ade80;--accent2:#60a5fa;--warn:#f97316;--text:#e2e8f0;--muted:#64748b}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:1rem}

.topbar{display:flex;align-items:baseline;gap:0.75rem;max-width:1200px;margin:0 auto 1rem}
h1{font-family:'DM Mono',monospace;font-size:1.3rem;color:var(--accent)}
.version{font-size:0.65rem;color:var(--muted);font-family:'DM Mono',monospace}
.sub{color:var(--muted);font-size:0.75rem;font-family:'DM Mono',monospace}

.layout{display:grid;grid-template-columns:300px 1fr;gap:1rem;max-width:1200px;margin:0 auto}
@media(max-width:720px){.layout{grid-template-columns:1fr}}

.panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1rem;margin-bottom:0.8rem}
.panel-title{font-size:0.68rem;color:var(--muted);font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:0.7rem}

textarea{width:100%;background:#0f1117;border:1px solid var(--border);border-radius:8px;padding:0.6rem 0.75rem;color:var(--text);font-size:0.88rem;font-family:'DM Sans',sans-serif;outline:none;resize:none;min-height:80px;transition:border 0.2s}
textarea:focus{border-color:var(--accent)}

.plan-btn{width:100%;margin-top:0.6rem;padding:0.7rem;background:var(--accent);color:#0f1117;border:none;border-radius:8px;font-weight:700;font-size:0.95rem;cursor:pointer;transition:all 0.2s;font-family:'DM Sans',sans-serif}
.plan-btn:disabled{opacity:0.35;cursor:not-allowed}
.plan-btn.running{background:var(--card);color:var(--accent);border:2px solid var(--accent);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}

.log{margin-top:0.7rem;font-size:0.72rem;font-family:'DM Mono',monospace;line-height:1.8;max-height:140px;overflow-y:auto}
.log .ok{color:var(--accent)}.log .info{color:var(--accent2)}.log .warn{color:var(--warn)}.log .err{color:#f87171}

#map{height:420px;border-radius:12px;overflow:hidden;margin-bottom:0.8rem}
@media(max-width:720px){#map{height:260px}}

.route-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:0.85rem 1rem;margin-bottom:0.5rem;cursor:pointer;transition:border 0.15s}
.route-card:hover,.route-card.active{border-color:var(--accent)}
.route-name{font-size:0.85rem;font-weight:600;margin-bottom:0.2rem}
.route-camp{font-size:0.73rem;color:var(--muted);margin-bottom:0.3rem}
.route-stats{display:flex;gap:0.8rem;font-size:0.78rem;flex-wrap:wrap}
.badge{font-size:0.65rem;padding:2px 7px;border-radius:4px;font-family:'DM Mono',monospace;margin-left:0.3rem}
.badge.ok{background:#14532d;color:#4ade80}.badge.warn{background:#451a03;color:#fb923c}
.card-btns{margin-top:0.55rem;display:flex;gap:0.4rem;flex-wrap:wrap}
.cbtn{font-size:0.75rem;padding:0.3rem 0.7rem;border-radius:6px;font-weight:600;cursor:pointer;border:none;font-family:'DM Sans',sans-serif}

.trip-item{padding:0.6rem 0.75rem;border-radius:8px;cursor:pointer;border:1px solid transparent;margin-bottom:0.35rem;transition:all 0.15s}
.trip-item:hover{border-color:var(--border);background:#0f1117}
.trip-item.active{border-color:var(--accent);background:#0f1117}
.trip-item-name{font-size:0.83rem;font-weight:600}
.trip-item-meta{font-size:0.7rem;color:var(--muted);font-family:'DM Mono',monospace;margin-top:0.15rem}

.overlay{display:none;position:fixed;top:0;left:0;right:0;z-index:9999;padding:0.65rem 1rem;background:#1a1d27;border-bottom:2px solid var(--accent);font-family:'DM Mono',monospace;font-size:0.78rem;color:var(--accent);align-items:center;gap:0.6rem}
.overlay.on{display:flex}
.spinner{display:inline-block;width:10px;height:10px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:middle;margin-right:4px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="overlay" class="overlay"><span class="spinner"></span><span id="overlayText">Plane...</span></div>

<div class="topbar">
  <h1>🗺️ VacationPlaner</h1>
  <span class="version">v0.5</span>
  <span class="sub">· brouter · overpass · no backend</span>
</div>

<div class="layout">
  <div>
    <div class="panel">
      <div class="panel-title">🤖 Planer</div>
      <textarea id="prompt" placeholder="z.B. 3 Routen ab Dresden, 80km, 1400hm, Erzgebirge, Gravel"></textarea>
      <button class="plan-btn" id="planBtn" onclick="runPlanner()">🚴 Planen</button>
      <div class="log" id="log"></div>
    </div>

    <div class="panel">
      <div class="panel-title">📁 Gespeicherte Trips</div>
      <div id="tripList"><div style="font-size:0.75rem;color:var(--muted)">Noch keine Trips.</div></div>
    </div>
  </div>

  <div>
    <div id="map"></div>
    <div id="results"></div>
  </div>
</div>

<script>
const REPO = 'chrisjhauptmann-ctrl/VacationPlaner';
const COLORS = ['#4ade80','#60a5fa','#f97316'];
let routeLayers = [], markerLayer = L.layerGroup().addTo(map), gpxStore = [], currentTrip = null;

// ── Map ───────────────────────────────────────────────────
const map = L.map('map').setView([51, 13], 7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {attribution:'© OpenStreetMap'}).addTo(map);

// ── Log ───────────────────────────────────────────────────
function log(msg, type='') {
  const el = document.getElementById('log');
  el.innerHTML += `<div class="${type}">${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}
function clearLog() { document.getElementById('log').innerHTML = ''; }
function setOverlay(txt) { document.getElementById('overlayText').textContent = txt; document.getElementById('overlay').classList.add('on'); }
function hideOverlay() { document.getElementById('overlay').classList.remove('on'); }

// ── Parse natural language input ──────────────────────────
function parseInput(text) {
  const t = text.toLowerCase();
  const km    = (t.match(/(\d+)\s*km/)  || [])[1];
  const hm    = (t.match(/(\d+)\s*hm/)  || [])[1];
  const num   = (t.match(/(\d+)\s*routen?/) || [])[1];
  const profile = t.includes('rennrad') || t.includes('road') ? 'fastbike'
                : t.includes('trek') || t.includes('touring') ? 'trekking'
                : 'gravel';
  const startMatch = text.match(/ab\s+([A-ZÄÖÜ][a-zäöüß]+(?:\s+[A-ZÄÖÜ][a-zäöüß]+)?)/);
  const start = startMatch ? startMatch[1] : null;
  return {
    start: start || text.split(',')[0].replace(/^\d+\s*routen?\s*/i,'').trim(),
    target_km: km ? parseInt(km) : 80,
    target_hm: hm ? parseInt(hm) : 1200,
    num_routes: num ? Math.min(parseInt(num), 3) : 3,
    profile
  };
}

// ── Geocode ───────────────────────────────────────────────
async function geocode(query) {
  const r = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=1`, {headers:{'Accept-Language':'de'}});
  const d = await r.json();
  if (!d.length) throw new Error(`Ort nicht gefunden: ${query}`);
  return {name: d[0].display_name.split(',')[0], lat: parseFloat(d[0].lat), lon: parseFloat(d[0].lon)};
}

// ── Find campsites via Overpass ───────────────────────────
async function findCampsites(lat, lon, radiusKm, count) {
  const r = radiusKm * 1000 * 0.65;
  const query = `[out:json][timeout:20];(node["tourism"="camp_site"](around:${r},${lat},${lon});way["tourism"="camp_site"](around:${r},${lat},${lon}););out center ${count * 3};`;
  const res = await fetch('https://overpass-api.de/api/interpreter', {method:'POST', body:'data='+encodeURIComponent(query)});
  const d = await res.json();
  const sites = d.elements
    .map(e => ({
      name: e.tags?.name || 'Campingplatz',
      lat: e.lat || e.center?.lat,
      lon: e.lon || e.center?.lon
    }))
    .filter(s => s.lat && s.lon && s.name !== 'Campingplatz');
  // spread them out — pick ones with different bearings from start
  return pickDiverse(sites, {lat, lon}, count);
}

// ── Pick campsites spread in different directions ─────────
function pickDiverse(sites, start, count) {
  if (sites.length <= count) return sites;
  const withBearing = sites.map(s => ({
    ...s,
    bearing: Math.atan2(s.lon - start.lon, s.lat - start.lat) * 180 / Math.PI
  }));
  withBearing.sort((a,b) => a.bearing - b.bearing);
  const step = withBearing.length / count;
  return Array.from({length: count}, (_, i) => withBearing[Math.floor(i * step)]);
}

// ── Find POI between start and campsite ───────────────────
async function findPOI(startLat, startLon, endLat, endLon) {
  const midLat = (startLat + endLat) / 2;
  const midLon = (startLon + endLon) / 2;
  const radius = Math.sqrt((endLat-startLat)**2 + (endLon-startLon)**2) * 70000;
  const query = `[out:json][timeout:10];(node["historic"~"castle|monument|ruins"](around:${radius},${midLat},${midLon});node["natural"="peak"](around:${radius},${midLat},${midLon});node["tourism"="viewpoint"](around:${radius},${midLat},${midLon}););out 5;`;
  const res = await fetch('https://overpass-api.de/api/interpreter', {method:'POST', body:'data='+encodeURIComponent(query)});
  const d = await res.json();
  const pois = d.elements.filter(e => e.tags?.name);
  if (!pois.length) return [];
  const p = pois[Math.floor(Math.random() * Math.min(3, pois.length))];
  return [{name: p.tags.name, lat: p.lat, lon: p.lon}];
}

// ── BRouter ───────────────────────────────────────────────
async function fetchRoute(waypoints, profile) {
  const lonlats = waypoints.map(w=>`${w.lon},${w.lat}`).join('|');
  const r = await fetch(`https://brouter.de/brouter?lonlats=${lonlats}&profile=${profile}&alternativeidx=0&format=geojson`);
  if (!r.ok) throw new Error(`BRouter ${r.status}`);
  return r.json();
}
async function fetchGPX(waypoints, profile) {
  const lonlats = waypoints.map(w=>`${w.lon},${w.lat}`).join('|');
  const r = await fetch(`https://brouter.de/brouter?lonlats=${lonlats}&profile=${profile}&alternativeidx=0&format=gpx`);
  return r.text();
}
function parseStats(geojson) {
  const p = geojson.features[0].properties;
  return {km: Math.round(parseInt(p['track-length'])/100)/10, hm: parseInt(p['filtered ascend']||0), h: Math.round(parseInt(p['total-time'])/360)/10};
}
function evaluate(stats, targetKm, targetHm) {
  const tolKm = Math.max(10, targetKm*0.15), tolHm = Math.max(250, targetHm*0.18);
  return {
    ok: Math.abs(stats.km-targetKm)<=tolKm && Math.abs(stats.hm-targetHm)<=tolHm,
    kmOk: Math.abs(stats.km-targetKm)<=tolKm, hmOk: Math.abs(stats.hm-targetHm)<=tolHm,
    kmDiff: Math.round((stats.km-targetKm)*10)/10, hmDiff: stats.hm-targetHm
  };
}

// ── Main planner ──────────────────────────────────────────
async function runPlanner() {
  const text = document.getElementById('prompt').value.trim();
  if (!text) return;
  clearLog(); clearMap();
  const btn = document.getElementById('planBtn');
  btn.disabled = true; btn.classList.add('running'); btn.textContent = '⏳ Plane...';
  setOverlay('Parse Eingabe...');

  try {
    const p = parseInput(text);
    log(`Start: ${p.start} | ${p.target_km}km | ${p.target_hm}hm | ${p.profile}`, 'info');

    setOverlay('Geocodiere Startort...');
    log('<span class="spinner"></span>Geocodiere...', 'info');
    const start = await geocode(p.start);
    log(`✓ ${start.name} (${start.lat.toFixed(3)}, ${start.lon.toFixed(3)})`, 'ok');

    setOverlay('Suche Campingplätze (Overpass)...');
    log('<span class="spinner"></span>Suche Campingplätze...', 'info');
    const campsites = await findCampsites(start.lat, start.lon, p.target_km, p.num_routes);
    if (!campsites.length) throw new Error('Keine Campingplätze in der Nähe gefunden');
    log(`✓ ${campsites.length} Campingplätze gefunden`, 'ok');

    // Build trip
    const trip = {
      name: `${start.name} – ${new Date().toLocaleDateString('de')}`,
      date: new Date().toISOString().slice(0,10),
      profile: p.profile,
      target_km: p.target_km,
      target_hm: p.target_hm,
      start,
      routes: []
    };

    // For each campsite: find POI + calculate route
    for (let i = 0; i < campsites.length; i++) {
      const camp = campsites[i];
      setOverlay(`Route ${i+1}/${campsites.length}: ${camp.name}...`);
      log(`<span class="spinner"></span>Route ${i+1}: ${camp.name}...`, 'info');

      const pois = await findPOI(start.lat, start.lon, camp.lat, camp.lon);
      trip.routes.push({name: `Route ${i+1}`, pois, campsite: camp});
    }

    setOverlay('BRouter berechnet Routen...');
    log('<span class="spinner"></span>BRouter berechnet...', 'info');
    const results = await calcAllRoutes(trip);
    renderTrip(trip, results);
    saveTrip(trip);
    log(`✅ Fertig!`, 'ok');

  } catch(e) {
    log(`❌ ${e.message}`, 'err');
  }

  hideOverlay();
  btn.disabled = false; btn.classList.remove('running'); btn.textContent = '🚴 Planen';
}

// ── Calculate all routes via BRouter ─────────────────────
async function calcAllRoutes(trip) {
  const results = [];
  for (const route of trip.routes) {
    const wps = [{lat:trip.start.lat, lon:trip.start.lon}, ...route.pois, {lat:route.campsite.lat, lon:route.campsite.lon}];
    try {
      const gj = await fetchRoute(wps, trip.profile);
      const gpx = await fetchGPX(wps, trip.profile);
      const stats = parseStats(gj);
      const ev = evaluate(stats, trip.target_km, trip.target_hm);
      results.push({ok:ev.ok, stats, ev, geojson:gj, gpx, wps});
    } catch(e) {
      results.push({ok:false, stats:{km:0,hm:0,h:0}, ev:{ok:false,kmOk:false,hmOk:false,kmDiff:0,hmDiff:0}, error:e.message});
    }
  }
  return results;
}

// ── Render ────────────────────────────────────────────────
function clearMap() {
  routeLayers.forEach(l=>map.removeLayer(l));
  routeLayers=[]; markerLayer.clearLayers(); gpxStore=[];
  document.getElementById('results').innerHTML='';
}

function renderTrip(trip, results) {
  currentTrip = trip;
  gpxStore = results.map(r=>r.gpx||'');

  L.marker([trip.start.lat, trip.start.lon]).addTo(markerLayer)
    .bindPopup(`🚴 ${trip.start.name}`).openPopup();

  let bounds = null;
  results.forEach((r, i) => {
    if (r.error || !r.geojson) { renderErrorCard(trip.routes[i], i, r.error); return; }
    const route = trip.routes[i];

    route.pois.forEach(p => L.circleMarker([p.lat,p.lon],{radius:6,color:'#fb923c',fillColor:'#fb923c',fillOpacity:0.8}).addTo(markerLayer).bindPopup(`📍 ${p.name}`));
    L.circleMarker([route.campsite.lat,route.campsite.lon],{radius:9,color:COLORS[i],fillColor:COLORS[i],fillOpacity:0.9}).addTo(markerLayer).bindPopup(`🏕️ ${route.campsite.name}`);

    const layer = L.geoJSON(r.geojson, {style:{color:COLORS[i],weight:i===0?4:3,opacity:i===0?1:0.7}}).addTo(map);
    routeLayers.push(layer);
    if (!bounds) bounds = layer.getBounds(); else bounds.extend(layer.getBounds());
    renderRouteCard(route, r.stats, r.ev, i);
  });

  if (bounds) map.fitBounds(bounds, {padding:[25,25]});
}

function renderRouteCard(route, stats, ev, i) {
  const badge = ev.ok ? '<span class="badge ok">✅ Ziel</span>' : '<span class="badge warn">⚠️ außerhalb</span>';
  const kmCol = ev.kmOk ? '#4ade80' : '#f87171';
  const hmCol = ev.hmOk ? '#4ade80' : '#f87171';
  const card = document.createElement('div');
  card.className = 'route-card';
  card.innerHTML = `
    <div class="route-name" style="color:${COLORS[i]}">Route ${i+1}: ${route.name} ${badge}</div>
    <div class="route-camp">🏕️ ${route.campsite.name}</div>
    <div class="route-stats">
      <span style="color:${kmCol}">🚴 ${stats.km}km (${ev.kmDiff>0?'+':''}${ev.kmDiff})</span>
      <span style="color:${hmCol}">⛰️ ${stats.hm}hm (${ev.hmDiff>0?'+':''}${ev.hmDiff})</span>
      <span>⏱️ ${stats.h}h</span>
    </div>
    <div class="card-btns">
      <button class="cbtn" style="background:var(--accent2);color:#0f1117" onclick="downloadGPX(${i})">⬇ GPX</button>
      <button class="cbtn" style="background:var(--accent);color:#0f1117" onclick="focusRoute(${i})">🗺 Fokus</button>
    </div>`;
  card.addEventListener('click', ()=>focusRoute(i));
  document.getElementById('results').appendChild(card);
}

function renderErrorCard(route, i, msg) {
  const card = document.createElement('div');
  card.className = 'route-card';
  card.innerHTML = `<div class="route-name" style="color:#f87171">Route ${i+1} ❌</div><div class="route-camp">🏕️ ${route.campsite.name}</div><div class="route-stats">${msg||'Fehler'}</div>`;
  document.getElementById('results').appendChild(card);
}

function focusRoute(i) {
  if (!routeLayers[i]) return;
  map.fitBounds(routeLayers[i].getBounds(), {padding:[20,20]});
  routeLayers.forEach((l,j)=>l&&l.setStyle({opacity:j===i?1:0.2,weight:j===i?5:2}));
  document.querySelectorAll('.route-card').forEach((c,j)=>c.classList.toggle('active',j===i));
}

function downloadGPX(i) {
  if (!gpxStore[i]) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([gpxStore[i]],{type:'application/gpx+xml'}));
  a.download = `route_${i+1}.gpx`;
  a.click();
}

// ── Trip library (localStorage) ───────────────────────────
function saveTrip(trip) {
  const saved = JSON.parse(localStorage.getItem('trips')||'[]');
  saved.unshift({...trip, _ts: Date.now()});
  localStorage.setItem('trips', JSON.stringify(saved.slice(0,15)));
  renderTripList();
}

function renderTripList() {
  const saved = JSON.parse(localStorage.getItem('trips')||'[]');
  const el = document.getElementById('tripList');
  if (!saved.length) { el.innerHTML = '<div style="font-size:0.75rem;color:var(--muted)">Noch keine Trips.</div>'; return; }
  el.innerHTML = '';
  saved.forEach(trip => {
    const div = document.createElement('div');
    div.className = 'trip-item';
    div.innerHTML = `<div class="trip-item-name">${trip.name}</div><div class="trip-item-meta">${trip.target_km}km · ${trip.profile}</div>`;
    div.onclick = async () => {
      document.querySelectorAll('.trip-item').forEach(x=>x.classList.remove('active'));
      div.classList.add('active');
      clearLog(); clearMap();
      setOverlay('Lade Trip...');
      log('<span class="spinner"></span>Berechne Routen...', 'info');
      const results = await calcAllRoutes(trip);
      renderTrip(trip, results);
      hideOverlay();
      log('✅ Fertig', 'ok');
    };
    el.appendChild(div);
  });
}

// ── Also load repo trips ───────────────────────────────────
async function loadRepoTrips() {
  try {
    const r = await fetch(`https://api.github.com/repos/${REPO}/contents/trips`);
    if (!r.ok) return;
    const files = await r.json();
    for (const f of files.filter(f=>f.name.endsWith('.json'))) {
      const trip = await (await fetch(f.download_url)).json();
      const div = document.createElement('div');
      div.className = 'trip-item';
      div.innerHTML = `<div class="trip-item-name">📁 ${trip.name}</div><div class="trip-item-meta">${trip.target_km}km · ${trip.profile}</div>`;
      div.onclick = async () => {
        document.querySelectorAll('.trip-item').forEach(x=>x.classList.remove('active'));
        div.classList.add('active');
        clearLog(); clearMap();
        setOverlay('Lade Trip...');
        const results = await calcAllRoutes(trip);
        renderTrip(trip, results);
        hideOverlay();
        log('✅ Fertig', 'ok');
      };
      document.getElementById('tripList').appendChild(div);
    }
  } catch(e) {}
}

renderTripList();
loadRepoTrips();
</script>
</body>
</html>
