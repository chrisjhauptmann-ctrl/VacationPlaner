<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🗺️ VacationPlaner</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f1117;--card:#1a1d27;--border:#2a2d3a;--accent:#4ade80;--accent2:#60a5fa;--warn:#f97316;--text:#e2e8f0;--muted:#64748b}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:1rem}
h1{font-family:'DM Mono',monospace;font-size:1.3rem;color:var(--accent);margin-bottom:0.2rem}
.sub{color:var(--muted);font-size:0.78rem;margin-bottom:1.2rem;font-family:'DM Mono',monospace}

/* Layout */
.layout{display:grid;grid-template-columns:300px 1fr;gap:1rem;max-width:1200px;margin:0 auto}
@media(max-width:720px){.layout{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1rem;margin-bottom:0.8rem}
.panel-title{font-size:0.68rem;color:var(--muted);font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:0.7rem}

/* Input */
textarea{width:100%;background:#0f1117;border:1px solid var(--border);border-radius:8px;padding:0.6rem 0.75rem;color:var(--text);font-size:0.88rem;font-family:'DM Sans',sans-serif;outline:none;resize:none;transition:border 0.2s;min-height:72px}
textarea:focus{border-color:var(--accent)}
input[type=password]{width:100%;background:#0f1117;border:1px solid var(--border);border-radius:8px;padding:0.5rem 0.75rem;color:var(--text);font-size:0.85rem;font-family:'DM Mono',monospace;outline:none;transition:border 0.2s;margin-bottom:0.5rem}
input[type=password]:focus{border-color:var(--accent2)}
.plan-btn{width:100%;margin-top:0.6rem;padding:0.65rem;background:var(--accent);color:#0f1117;border:none;border-radius:8px;font-weight:700;font-size:0.9rem;cursor:pointer;transition:opacity 0.2s;font-family:'DM Sans',sans-serif}
.plan-btn:disabled{opacity:0.35;cursor:not-allowed}

/* Agent log */
.log{margin-top:0.7rem;font-size:0.72rem;font-family:'DM Mono',monospace;color:var(--muted);line-height:1.7;max-height:130px;overflow-y:auto}
.log .ok{color:var(--accent)}
.log .warn{color:var(--warn)}
.log .err{color:#f87171}
.log .info{color:var(--accent2)}

/* Map */
#map{height:400px;border-radius:12px;overflow:hidden;margin-bottom:0.8rem}
@media(max-width:720px){#map{height:250px}}

/* Route cards */
.route-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:0.85rem 1rem;margin-bottom:0.5rem;cursor:pointer;transition:border 0.15s}
.route-card:hover,.route-card.active{border-color:var(--accent)}
.route-name{font-size:0.85rem;font-weight:600;margin-bottom:0.2rem}
.route-camp{font-size:0.73rem;color:var(--muted);margin-bottom:0.3rem}
.route-stats{display:flex;gap:0.8rem;font-size:0.78rem;flex-wrap:wrap}
.badge{font-size:0.65rem;padding:2px 7px;border-radius:4px;font-family:'DM Mono',monospace;margin-left:0.3rem;vertical-align:middle}
.badge.ok{background:#14532d;color:#4ade80}
.badge.warn{background:#451a03;color:#fb923c}
.card-btns{margin-top:0.55rem;display:flex;gap:0.4rem}
.cbtn{font-size:0.75rem;padding:0.28rem 0.65rem;border-radius:6px;font-weight:600;cursor:pointer;border:none;font-family:'DM Sans',sans-serif}

/* Trip library */
.trip-item{padding:0.6rem 0.75rem;border-radius:8px;cursor:pointer;border:1px solid transparent;margin-bottom:0.35rem;transition:all 0.15s}
.trip-item:hover{border-color:var(--border);background:#0f1117}
.trip-item.active{border-color:var(--accent);background:#0f1117}
.trip-item-name{font-size:0.83rem;font-weight:600}
.trip-item-meta{font-size:0.7rem;color:var(--muted);font-family:'DM Mono',monospace;margin-top:0.15rem}

.spinner{display:inline-block;width:10px;height:10px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:middle;margin-right:4px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div style="max-width:1200px;margin:0 auto">
  <h1>🗺️ VacationPlaner</h1>
  <div class="sub">ai-powered bikepacking planner · brouter · no backend</div>
</div>

<div class="layout">
  <!-- LEFT -->
  <div>
    <!-- AI Planner -->
    <div class="panel">
      <div class="panel-title">🤖 KI-Planer</div>
      <input type="password" id="token" placeholder="GitHub Token (ghp_...)" autocomplete="off"/>
      <textarea id="prompt" placeholder="z.B. Plan mir 3 Routen ab Dresden, 80km, 1400hm, Erzgebirge, Gravel"></textarea>
      <button class="plan-btn" id="planBtn" onclick="runAgent()">🚴 Planen</button>
      <div class="log" id="agentLog"></div>
    </div>

    <!-- Trip Library -->
    <div class="panel">
      <div class="panel-title">📁 Gespeicherte Trips</div>
      <div id="tripList"><div style="font-size:0.75rem;color:var(--muted)"><span class="spinner"></span>Lade...</div></div>
    </div>
  </div>

  <!-- RIGHT -->
  <div>
    <div id="map"></div>
    <div id="routeResults"></div>
  </div>
</div>

<script>
const REPO = 'chrisjhauptmann-ctrl/VacationPlaner';
const GH_MODELS = 'https://models.inference.ai.azure.com/chat/completions';
const MODEL = 'gpt-4o-mini';
const COLORS = ['#4ade80','#60a5fa','#f97316'];
const MAX_ITER = 3;

// ── Token persistence ─────────────────────────────────────
const tokenEl = document.getElementById('token');
tokenEl.value = localStorage.getItem('gh_token') || '';
tokenEl.addEventListener('change', () => localStorage.setItem('gh_token', tokenEl.value.trim()));

// ── Map ───────────────────────────────────────────────────
const map = L.map('map').setView([51, 13], 7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {attribution:'© OpenStreetMap'}).addTo(map);
let routeLayers = [], markerLayer = L.layerGroup().addTo(map), gpxStore = [];

// ── Log helper ────────────────────────────────────────────
function log(msg, type='') {
  const el = document.getElementById('agentLog');
  el.innerHTML += `<div class="${type}">${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}
function clearLog() { document.getElementById('agentLog').innerHTML = ''; }

// ── GitHub Models call ────────────────────────────────────
async function callAI(messages) {
  const token = tokenEl.value.trim();
  if (!token) throw new Error('Kein GitHub Token');
  localStorage.setItem('gh_token', token);
  const r = await fetch(GH_MODELS, {
    method: 'POST',
    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({ model: MODEL, messages, response_format: { type: 'json_object' }, temperature: 0.3 })
  });
  if (!r.ok) {
    const e = await r.json().catch(() => ({}));
    throw new Error(`AI Fehler ${r.status}: ${e.error?.message || r.statusText}`);
  }
  const data = await r.json();
  return JSON.parse(data.choices[0].message.content);
}

// ── BRouter ───────────────────────────────────────────────
async function fetchRoute(waypoints, profile) {
  const lonlats = waypoints.map(w => `${w.lon},${w.lat}`).join('|');
  const r = await fetch(`https://brouter.de/brouter?lonlats=${lonlats}&profile=${profile}&alternativeidx=0&format=geojson`);
  if (!r.ok) throw new Error(`BRouter ${r.status}`);
  return r.json();
}
async function fetchGPX(waypoints, profile) {
  const lonlats = waypoints.map(w => `${w.lon},${w.lat}`).join('|');
  const r = await fetch(`https://brouter.de/brouter?lonlats=${lonlats}&profile=${profile}&alternativeidx=0&format=gpx`);
  return r.text();
}
function parseStats(geojson) {
  const p = geojson.features[0].properties;
  return {
    km: Math.round(parseInt(p['track-length']) / 100) / 10,
    hm: parseInt(p['filtered ascend'] || 0),
    h:  Math.round(parseInt(p['total-time']) / 360) / 10
  };
}

// ── Evaluate ──────────────────────────────────────────────
function evaluate(stats, targetKm, targetHm) {
  const tolKm = Math.max(10, targetKm * 0.12);
  const tolHm = Math.max(200, targetHm * 0.15);
  return {
    ok: Math.abs(stats.km - targetKm) <= tolKm && Math.abs(stats.hm - targetHm) <= tolHm,
    kmOk: Math.abs(stats.km - targetKm) <= tolKm,
    hmOk: Math.abs(stats.hm - targetHm) <= tolHm,
    kmDiff: Math.round((stats.km - targetKm) * 10) / 10,
    hmDiff: stats.hm - targetHm
  };
}

// ── System prompt ─────────────────────────────────────────
const SYSTEM = `Du bist ein Bikepacking-Routenplaner. Antworte NUR mit validem JSON.

Generiere einen Trip mit diesem Format:
{
  "name": "Kurzname",
  "date": "YYYY-MM-DD",
  "profile": "gravel",
  "target_km": 80,
  "target_hm": 1400,
  "start": {"name": "Stadtname", "lat": 0.0, "lon": 0.0},
  "routes": [
    {
      "name": "Routenname",
      "pois": [{"name": "Ort", "lat": 0.0, "lon": 0.0}],
      "campsite": {"name": "Campingplatz", "lat": 0.0, "lon": 0.0}
    }
  ]
}

Regeln:
- Nutze echte Koordinaten (WGS84) für alle Orte
- Für ${80}km Fahrradroute: Luftlinie Ziel ca. 50-60km vom Start
- Profile: gravel, trekking, fastbike
- Campingplätze müssen real existieren
- Datum heute falls nicht angegeben: ${new Date().toISOString().slice(0,10)}
- Maximal 3 Routen, jede mit eigenem Campingplatz`;

// ── Agent loop ────────────────────────────────────────────
async function runAgent() {
  const prompt = document.getElementById('prompt').value.trim();
  if (!prompt) return;
  clearLog();
  document.getElementById('planBtn').disabled = true;
  document.getElementById('routeResults').innerHTML = '';
  routeLayers.forEach(l => map.removeLayer(l));
  routeLayers = []; markerLayer.clearLayers(); gpxStore = [];

  try {
    // Step 1: initial AI plan
    log('<span class="spinner"></span>KI plant Route...', 'info');
    let trip = await callAI([
      { role: 'system', content: SYSTEM },
      { role: 'user', content: prompt }
    ]);
    log(`✓ Plan erstellt: ${trip.name}`, 'ok');
    log(`  Start: ${trip.start.name} | Ziel: ${trip.target_km}km / ${trip.target_hm}hm`, 'info');

    // Iteration loop
    for (let iter = 0; iter < MAX_ITER; iter++) {
      log(`<span class="spinner"></span>BRouter berechnet (Versuch ${iter+1})...`, 'info');
      const results = await validateRoutes(trip);
      const allOk = results.every(r => r.ok);
      const summary = results.map((r, i) =>
        `Route ${i+1}: ${r.stats.km}km/${r.stats.hm}hm ${r.ok ? '✅' : '⚠️'}`
      ).join(' | ');
      log(summary, allOk ? 'ok' : 'warn');

      if (allOk || iter === MAX_ITER - 1) {
        log(`✓ Fertig nach ${iter+1} Versuch(en)`, 'ok');
        renderTrip(trip, results);
        saveTripToList(trip);
        break;
      }

      // Refine with AI
      const feedback = results.map((r, i) =>
        `Route ${i+1} (${trip.routes[i].name}): ${r.stats.km}km (Ziel: ${trip.target_km}km, Diff: ${r.ev.kmDiff > 0 ? '+' : ''}${r.ev.kmDiff}km), ${r.stats.hm}hm (Ziel: ${trip.target_hm}hm, Diff: ${r.ev.hmDiff > 0 ? '+' : ''}${r.ev.hmDiff}hm). ${r.ok ? 'OK' : 'ANPASSEN'}`
      ).join('\n');

      log('<span class="spinner"></span>KI passt Waypoints an...', 'info');
      trip = await callAI([
        { role: 'system', content: SYSTEM },
        { role: 'user', content: prompt },
        { role: 'assistant', content: JSON.stringify(trip) },
        { role: 'user', content: `BRouter Ergebnisse:\n${feedback}\n\nBitte passe die Routen an damit sie das Kilometerziel treffen. Gib das komplette JSON zurück.` }
      ]);
      log(`✓ Angepasst`, 'ok');
    }
  } catch(e) {
    log(`❌ ${e.message}`, 'err');
  }
  document.getElementById('planBtn').disabled = false;
}

// ── Validate routes via BRouter ───────────────────────────
async function validateRoutes(trip) {
  const results = [];
  for (const route of trip.routes) {
    const waypoints = [
      { lat: trip.start.lat, lon: trip.start.lon },
      ...route.pois,
      { lat: route.campsite.lat, lon: route.campsite.lon }
    ];
    try {
      const geojson = await fetchRoute(waypoints, trip.profile);
      const stats = parseStats(geojson);
      const ev = evaluate(stats, trip.target_km, trip.target_hm);
      const gpx = await fetchGPX(waypoints, trip.profile);
      results.push({ ok: ev.ok, stats, ev, geojson, gpx, waypoints });
    } catch(e) {
      results.push({ ok: false, stats: { km: 0, hm: 0, h: 0 }, ev: { ok: false, kmOk: false, hmOk: false, kmDiff: 0, hmDiff: 0 }, error: e.message });
    }
  }
  return results;
}

// ── Render final trip ─────────────────────────────────────
function renderTrip(trip, results) {
  gpxStore = results.map(r => r.gpx);

  // Start marker
  L.marker([trip.start.lat, trip.start.lon]).addTo(markerLayer)
    .bindPopup(`🚴 Start: ${trip.start.name}`).openPopup();

  let firstBounds = null;
  results.forEach((r, i) => {
    if (r.error || !r.geojson) return;
    const route = trip.routes[i];

    // POI markers
    route.pois.forEach(p => {
      L.circleMarker([p.lat, p.lon], { radius:6, color:'#fb923c', fillColor:'#fb923c', fillOpacity:0.8 })
        .addTo(markerLayer).bindPopup(`📍 ${p.name}`);
    });

    // Campsite marker
    L.circleMarker([route.campsite.lat, route.campsite.lon], { radius:9, color:COLORS[i], fillColor:COLORS[i], fillOpacity:0.9 })
      .addTo(markerLayer).bindPopup(`🏕️ ${route.campsite.name}`);

    // Route layer
    const layer = L.geoJSON(r.geojson, {
      style: { color: COLORS[i], weight: i===0 ? 4 : 3, opacity: i===0 ? 1 : 0.7 }
    }).addTo(map);
    routeLayers.push(layer);
    if (!firstBounds) firstBounds = layer.getBounds();

    // Card
    renderRouteCard(route, r.stats, r.ev, i);
  });

  if (firstBounds) map.fitBounds(firstBounds, { padding: [25, 25] });
}

function renderRouteCard(route, stats, ev, i) {
  const badge = ev.ok ? '<span class="badge ok">✅ Ziel</span>' : '<span class="badge warn">⚠️ außerhalb</span>';
  const kmCol = ev.kmOk ? '#4ade80' : '#f87171';
  const hmCol = ev.hmOk ? '#4ade80' : '#f87171';
  const card = document.createElement('div');
  card.className = 'route-card';
  card.innerHTML = `
    <div class="route-name" style="color:${COLORS[i]}">Route ${i+1}: ${route.name} ${badge}</div>
    <div class="route-camp">🏕️ ${route.campsite.name}</div>
    <div class="route-stats">
      <span style="color:${kmCol}">🚴 ${stats.km}km (${ev.kmDiff>0?'+':''}${ev.kmDiff})</span>
      <span style="color:${hmCol}">⛰️ ${stats.hm}hm (${ev.hmDiff>0?'+':''}${ev.hmDiff})</span>
      <span>⏱️ ${stats.h}h</span>
    </div>
    <div class="card-btns">
      <button class="cbtn" style="background:var(--accent2);color:#0f1117" onclick="downloadGPX(${i})">⬇ GPX</button>
      <button class="cbtn" style="background:var(--accent);color:#0f1117" onclick="focusRoute(${i})">🗺 Fokus</button>
    </div>
  `;
  card.addEventListener('click', () => focusRoute(i));
  document.getElementById('routeResults').appendChild(card);
}

function focusRoute(i) {
  if (routeLayers[i]) {
    map.fitBounds(routeLayers[i].getBounds(), { padding: [20,20] });
    routeLayers.forEach((l,j) => l && l.setStyle({ opacity: j===i?1:0.2, weight: j===i?5:2 }));
    document.querySelectorAll('.route-card').forEach((c,j) => c.classList.toggle('active', j===i));
  }
}

function downloadGPX(i) {
  if (!gpxStore[i]) return;
  const blob = new Blob([gpxStore[i]], { type:'application/gpx+xml' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `route_${i+1}.gpx`;
  a.click();
}

// ── Trip library ──────────────────────────────────────────
function saveTripToList(trip) {
  const saved = JSON.parse(localStorage.getItem('saved_trips') || '[]');
  saved.unshift({ ...trip, _saved: new Date().toISOString() });
  localStorage.setItem('saved_trips', JSON.stringify(saved.slice(0, 20)));
  renderTripList();
}

function renderTripList() {
  const saved = JSON.parse(localStorage.getItem('saved_trips') || '[]');
  const el = document.getElementById('tripList');
  if (!saved.length) {
    el.innerHTML = '<div style="font-size:0.75rem;color:var(--muted)">Noch keine Trips geplant.</div>';
    return;
  }
  el.innerHTML = '';
  saved.forEach((trip, i) => {
    const div = document.createElement('div');
    div.className = 'trip-item';
    div.innerHTML = `
      <div class="trip-item-name">${trip.name}</div>
      <div class="trip-item-meta">${trip.date} · ${trip.target_km}km · ${trip.profile}</div>
    `;
    div.addEventListener('click', async () => {
      document.querySelectorAll('.trip-item').forEach(x => x.classList.remove('active'));
      div.classList.add('active');
      clearLog();
      log('<span class="spinner"></span>Lade gespeicherten Trip...', 'info');
      document.getElementById('routeResults').innerHTML = '';
      routeLayers.forEach(l => map.removeLayer(l));
      routeLayers = []; markerLayer.clearLayers(); gpxStore = [];
      const results = await validateRoutes(trip);
      renderTrip(trip, results);
      log('✓ Trip geladen', 'ok');
    });
    el.appendChild(div);
  });
}

// Also load trips from repo
async function loadRepoTrips() {
  try {
    const r = await fetch(`https://api.github.com/repos/${REPO}/contents/trips`);
    if (!r.ok) return;
    const files = await r.json();
    const jsonFiles = files.filter(f => f.name.endsWith('.json'));
    for (const f of jsonFiles) {
      const trip = await (await fetch(f.download_url)).json();
      const div = document.createElement('div');
      div.className = 'trip-item';
      div.innerHTML = `
        <div class="trip-item-name">📁 ${trip.name}</div>
        <div class="trip-item-meta">${trip.date} · ${trip.target_km}km · ${trip.profile}</div>
      `;
      div.addEventListener('click', async () => {
        document.querySelectorAll('.trip-item').forEach(x => x.classList.remove('active'));
        div.classList.add('active');
        clearLog();
        log('<span class="spinner"></span>Berechne Routen...', 'info');
        document.getElementById('routeResults').innerHTML = '';
        routeLayers.forEach(l => map.removeLayer(l));
        routeLayers = []; markerLayer.clearLayers(); gpxStore = [];
        const results = await validateRoutes(trip);
        renderTrip(trip, results);
        log('✓ Fertig', 'ok');
      });
      document.getElementById('tripList').appendChild(div);
    }
  } catch(e) {}
}

// ── Init ──────────────────────────────────────────────────
renderTripList();
loadRepoTrips();
</script>
</body>
</html>
